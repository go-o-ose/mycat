name: Build APK

on:
  push:
    branches: [ main ] # Сработает автоматически при пуше в ветку main
  workflow_dispatch: # Добавляет кнопку для ручного запуска в интерфейсе

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ steps.get-date.outputs.date }}

      - name: Buildozer Action
        uses: ArtemGovorov/buildozer-action@v1
        with:
          buildozer_version: stable
          command: buildozer android debug
          repository_root: .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-App-APK
          path: bin/*.apk
